<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>記錄</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    /* 深色運動風：黑底 + 螢光綠 + Manrope */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope","Noto Sans TC",system-ui,sans-serif; background: #0e1116; color: #e6edf3; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
    .header { background: #0b0e12; color: #fff; border-bottom: 1px solid #1c2430; padding: calc(16px + env(safe-area-inset-top)) 20px 16px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .content { padding: 16px; }
    .card { background: #161b22; border: 1px solid #232c38; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #7d8896; margin: 12px 0 6px; }
    input[type=number], input[type=date], input[type=text] { width: 100%; padding: 12px; background: #0e1116; color: #e6edf3; border: 1px solid #2b333d; border-radius: 10px; font-size: 16px; font-family: inherit; }
    input[type=number]:focus, input[type=date]:focus, input[type=text]:focus { outline: none; border-color: #00e676; }
    input[type=file] { color: #9aa4b2; font-size: 13px; }
    button.save { width: 100%; padding: 14px; background: #00e676; color: #06210f; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; margin-top: 20px; letter-spacing: .01em; }
    button.period { width: 100%; padding: 14px; background: rgba(255,92,138,.12); color: #ffd0de; border: 1px solid rgba(255,92,138,.5); border-radius: 12px; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 9px; letter-spacing: .01em; }
    button.period .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5c8a; box-shadow: 0 0 0 4px rgba(255,92,138,.22); }
    .row { display: flex; gap: 12px; }
    .msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
    img.preview { max-width: 100%; border-radius: 10px; margin-top: 8px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0b0e12; border-top: 1px solid #1c2430; padding-bottom: env(safe-area-inset-bottom); }
    .nav a { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #7d8896; text-decoration: none; }
    .nav a.active { color: #00e676; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">新增記錄</div>
  <div class="content">
    <div class="card">
      <label>日期</label>
      <input type="date" id="date">
      <label>體重 (kg) *</label>
      <input type="number" step="0.1" id="weight" inputmode="decimal">
      <label>腰圍 (cm，選填)</label>
      <input type="number" step="0.1" id="waist" inputmode="decimal">
      <label>正面照（選填）</label>
      <input type="file" id="photo_front" accept="image/*">
      <img class="preview" id="preview_front" style="display:none">
      <label>側面照（選填）</label>
      <input type="file" id="photo_side" accept="image/*">
      <img class="preview" id="preview_side" style="display:none">
      <label>背面照（選填）</label>
      <input type="file" id="photo_back" accept="image/*">
      <img class="preview" id="preview_back" style="display:none">
      <label>備註（選填）</label>
      <input type="text" id="note">
      <button class="save" id="save">儲存</button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- 生理期記錄 -->
    <div class="card">
      <h2 style="font-size:13px;color:#7d8896;margin:0 0 4px;font-weight:600">生理期</h2>
      <p style="font-size:12px;color:#7d8896;margin:0 0 12px;line-height:1.5">來的那天點一下就好。忘了記可以把日期往回改，補登過去某天。</p>
      <label>開始日期（可往回補登）</label>
      <input type="date" id="periodDate">
      <button class="period" id="periodBtn"><span class="dot"></span>記錄生理期開始</button>
      <div class="msg" id="periodMsg"></div>
      <div class="row">
        <div style="flex:1"><label>經期天數</label><input type="number" step="1" id="periodDays" inputmode="numeric" placeholder="7"></div>
        <div style="flex:1"><label>週期天數</label><input type="number" step="1" id="cycleDays" inputmode="numeric" placeholder="30"></div>
      </div>
      <button class="save" id="saveSettings" style="background:#232c38;color:#e6edf3">儲存設定</button>
      <div class="msg" id="settingsMsg"></div>
    </div>
  </div>
  <nav class="nav">
    <a href="index.html">儀表板</a>
    <a href="add.html" class="active">記錄</a>
    <a href="photos.html">照片</a>
  </nav>
  <script src="js/api.js"></script>
  <script>
    API.requireAuth();   // 沒密碼先鎖屏（蓋住整頁）
    // 台灣早上量體重常在 08:00 前，toISOString() 會轉成 UTC 而倒退一天（NEVER-#2 時區 bug），
    // 改用本地年/月/日組字串，與 calc.js 的 formatLocalDate 邏輯一致
    const pad2 = (n) => String(n).padStart(2, '0');
    const d0 = new Date();
    document.getElementById('date').value = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
    const msg = document.getElementById('msg');
    // 三個角度共用同一套：壓縮＋預覽＋錯誤處理。base64 存在 photoData[angle]
    const angles = ['front', 'side', 'back'];
    const photoData = { front: null, side: null, back: null };
    angles.forEach((a) => {
      const input = document.getElementById('photo_' + a);
      const preview = document.getElementById('preview_' + a);
      input.addEventListener('change', (e) => {
        const f = e.target.files[0]; if (!f) return;
        const resetPhoto = () => {
          photoData[a] = null; input.value = ''; preview.style.display = 'none';
          msg.textContent = '圖片讀取失敗，換一張試試'; msg.style.color = '#C62828';
        };
        // 壓縮：長邊縮到 1080，JPEG 0.7，避免 base64 過大
        const img = new Image(); const rd = new FileReader();
        rd.onerror = resetPhoto; img.onerror = resetPhoto;
        rd.onload = () => { img.onload = () => {
          const max = 1080; let { width: w, height: h } = img;
          if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w*r); h = Math.round(h*r); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          photoData[a] = c.toDataURL('image/jpeg', 0.7);
          preview.src = photoData[a]; preview.style.display = 'block';
        }; img.src = rd.result; };
        rd.readAsDataURL(f);
      });
    });
    document.getElementById('save').addEventListener('click', async () => {
      const weight = document.getElementById('weight').value;
      if (!weight) { msg.textContent = '請填體重'; msg.style.color = '#C62828'; return; }
      msg.textContent = '儲存中…'; msg.style.color = '#777';
      const payload = {
        date: document.getElementById('date').value,
        weight_kg: parseFloat(weight),
        waist_cm: document.getElementById('waist').value ? parseFloat(document.getElementById('waist').value) : '',
        note: document.getElementById('note').value,
        photo_front_base64: photoData.front || '',
        photo_side_base64: photoData.side || '',
        photo_back_base64: photoData.back || '',
        client_id: API.genClientId(),
      };
      try {
        const r = await API.apiPost('addBody', payload);
        if (r.ok) { msg.textContent = '已儲存 ✓'; msg.style.color = '#2E7D32';
          document.getElementById('weight').value = ''; document.getElementById('waist').value = '';
          document.getElementById('note').value = '';
          angles.forEach((a) => { photoData[a] = null; document.getElementById('photo_' + a).value = '';
            document.getElementById('preview_' + a).style.display = 'none'; });
        }
        else { msg.textContent = '失敗：' + r.error; msg.style.color = '#C62828'; }
      } catch (err) { msg.textContent = '網路錯誤：' + err.message; msg.style.color = '#C62828'; }
    });

    // ── 生理期記錄 ──
    const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    document.getElementById('periodDate').value = todayStr();   // 預設今天，可往回改補登
    const periodMsg = document.getElementById('periodMsg');
    document.getElementById('periodBtn').addEventListener('click', async () => {
      const pdate = document.getElementById('periodDate').value || todayStr();
      periodMsg.textContent = '記錄中…'; periodMsg.style.color = '#777';
      try {
        const r = await API.apiPost('addCycle', { date: pdate, client_id: API.genClientId() });
        if (r.ok) {
          periodMsg.style.color = '#2E7D32';
          periodMsg.textContent = r.deduped ? (pdate + ' 已經記錄過了 ✓') : ('已記錄 ' + pdate + ' ✓');
        } else { periodMsg.textContent = '失敗：' + r.error; periodMsg.style.color = '#C62828'; }
      } catch (err) { periodMsg.textContent = '網路錯誤：' + err.message; periodMsg.style.color = '#C62828'; }
    });

    // 設定：載入時把目前的經期/週期天數帶進欄位
    const settingsMsg = document.getElementById('settingsMsg');
    (async () => {
      try {
        const res = await API.apiGet('getSettings');
        if (res && res.ok) {
          if (res.data.period_days) document.getElementById('periodDays').value = res.data.period_days;
          if (res.data.cycle_days) document.getElementById('cycleDays').value = res.data.cycle_days;
        }
      } catch (e) {}
    })();
    document.getElementById('saveSettings').addEventListener('click', async () => {
      const pd = document.getElementById('periodDays').value;
      const cd = document.getElementById('cycleDays').value;
      settingsMsg.textContent = '儲存中…'; settingsMsg.style.color = '#777';
      try {
        if (pd) await API.apiPost('setSetting', { key: 'period_days', value: parseInt(pd, 10) });
        if (cd) await API.apiPost('setSetting', { key: 'cycle_days', value: parseInt(cd, 10) });
        settingsMsg.textContent = '設定已儲存 ✓'; settingsMsg.style.color = '#2E7D32';
      } catch (err) { settingsMsg.textContent = '網路錯誤：' + err.message; settingsMsg.style.color = '#C62828'; }
    });
  </script>
</body>
</html>
