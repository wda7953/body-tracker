<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>記錄</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #FAF7F2; color: #3A2E24; padding-bottom: 80px; }
    .header { background: #7A5C3E; color: #fff; padding: calc(16px + env(safe-area-inset-top)) 20px 16px; font-size: 18px; font-weight: 600; }
    .content { padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    label { display: block; font-size: 13px; color: #777; margin: 12px 0 6px; }
    input[type=number], input[type=date], input[type=text] { width: 100%; padding: 12px; border: 1px solid #E5DED5; border-radius: 10px; font-size: 16px; font-family: inherit; }
    button.save { width: 100%; padding: 14px; background: #7A5C3E; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 20px; }
    .msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
    img.preview { max-width: 100%; border-radius: 10px; margin-top: 8px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom); }
    .nav a { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #999; text-decoration: none; }
    .nav a.active { color: #7A5C3E; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">新增記錄</div>
  <div class="content">
    <div class="card">
      <label>日期</label>
      <input type="date" id="date">
      <label>體重 (kg) *</label>
      <input type="number" step="0.1" id="weight" inputmode="decimal">
      <label>腰圍 (cm，選填)</label>
      <input type="number" step="0.1" id="waist" inputmode="decimal">
      <label>照片（選填）</label>
      <input type="file" id="photo" accept="image/*" capture="environment">
      <img class="preview" id="preview" style="display:none">
      <label>備註（選填）</label>
      <input type="text" id="note">
      <button class="save" id="save">儲存</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <nav class="nav">
    <a href="index.html">儀表板</a>
    <a href="add.html" class="active">記錄</a>
    <a href="photos.html">照片</a>
  </nav>
  <script src="js/api.js"></script>
  <script>
    document.getElementById('date').value = new Date().toISOString().slice(0, 10);
    let photoBase64 = null;
    document.getElementById('photo').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      // 壓縮：長邊縮到 1080，JPEG 0.7，避免 base64 過大
      const img = new Image(); const rd = new FileReader();
      rd.onload = () => { img.onload = () => {
        const max = 1080; let { width: w, height: h } = img;
        if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w*r); h = Math.round(h*r); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        photoBase64 = c.toDataURL('image/jpeg', 0.7);
        const p = document.getElementById('preview'); p.src = photoBase64; p.style.display = 'block';
      }; img.src = rd.result; };
      rd.readAsDataURL(f);
    });
    document.getElementById('save').addEventListener('click', async () => {
      const weight = document.getElementById('weight').value;
      const msg = document.getElementById('msg');
      if (!weight) { msg.textContent = '請填體重'; msg.style.color = '#C62828'; return; }
      msg.textContent = '儲存中…'; msg.style.color = '#777';
      const payload = {
        date: document.getElementById('date').value,
        weight_kg: parseFloat(weight),
        waist_cm: document.getElementById('waist').value ? parseFloat(document.getElementById('waist').value) : '',
        note: document.getElementById('note').value,
        photo_base64: photoBase64 || '',
        client_id: API.genClientId(),
      };
      try {
        const r = await API.apiPost('addBody', payload);
        if (r.ok) { msg.textContent = '已儲存 ✓'; msg.style.color = '#2E7D32';
          document.getElementById('weight').value = ''; document.getElementById('waist').value = '';
          document.getElementById('note').value = ''; photoBase64 = null;
          document.getElementById('preview').style.display = 'none'; }
        else { msg.textContent = '失敗：' + r.error; msg.style.color = '#C62828'; }
      } catch (err) { msg.textContent = '網路錯誤：' + err.message; msg.style.color = '#C62828'; }
    });
  </script>
</body>
</html>
