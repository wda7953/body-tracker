<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>記錄</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    /* 深色運動風：黑底 + 螢光綠 + Manrope */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope","Noto Sans TC",system-ui,sans-serif; background: #0e1116; color: #e6edf3; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
    .header { background: #0b0e12; color: #fff; border-bottom: 1px solid #1c2430; padding: calc(16px + env(safe-area-inset-top)) 20px 16px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .content { padding: 16px; }
    .card { background: #161b22; border: 1px solid #232c38; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #7d8896; margin: 12px 0 6px; }
    input[type=number], input[type=date], input[type=text] { width: 100%; padding: 12px; background: #0e1116; color: #e6edf3; border: 1px solid #2b333d; border-radius: 10px; font-size: 16px; font-family: inherit; }
    input[type=number]:focus, input[type=date]:focus, input[type=text]:focus { outline: none; border-color: #00e676; }
    input[type=file] { color: #9aa4b2; font-size: 13px; }
    button.save { width: 100%; padding: 14px; background: #00e676; color: #06210f; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; margin-top: 20px; letter-spacing: .01em; }
    .msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 20px; }
    img.preview { max-width: 100%; border-radius: 10px; margin-top: 8px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0b0e12; border-top: 1px solid #1c2430; padding-bottom: env(safe-area-inset-bottom); }
    .nav a { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #7d8896; text-decoration: none; }
    .nav a.active { color: #00e676; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">新增記錄</div>
  <div class="content">
    <div class="card">
      <label>日期</label>
      <input type="date" id="date">
      <label>體重 (kg) *</label>
      <input type="number" step="0.1" id="weight" inputmode="decimal">
      <label>腰圍 (cm，選填)</label>
      <input type="number" step="0.1" id="waist" inputmode="decimal">
      <label>正面照（選填）</label>
      <input type="file" id="photo_front" accept="image/*">
      <img class="preview" id="preview_front" style="display:none">
      <label>側面照（選填）</label>
      <input type="file" id="photo_side" accept="image/*">
      <img class="preview" id="preview_side" style="display:none">
      <label>背面照（選填）</label>
      <input type="file" id="photo_back" accept="image/*">
      <img class="preview" id="preview_back" style="display:none">
      <label>備註（選填）</label>
      <input type="text" id="note">
      <button class="save" id="save">儲存</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <nav class="nav">
    <a href="index.html">儀表板</a>
    <a href="add.html" class="active">記錄</a>
    <a href="photos.html">照片</a>
  </nav>
  <script src="js/api.js"></script>
  <script>
    // 台灣早上量體重常在 08:00 前，toISOString() 會轉成 UTC 而倒退一天（NEVER-#2 時區 bug），
    // 改用本地年/月/日組字串，與 calc.js 的 formatLocalDate 邏輯一致
    const pad2 = (n) => String(n).padStart(2, '0');
    const d0 = new Date();
    document.getElementById('date').value = `${d0.getFullYear()}-${pad2(d0.getMonth() + 1)}-${pad2(d0.getDate())}`;
    const msg = document.getElementById('msg');
    // 三個角度共用同一套：壓縮＋預覽＋錯誤處理。base64 存在 photoData[angle]
    const angles = ['front', 'side', 'back'];
    const photoData = { front: null, side: null, back: null };
    angles.forEach((a) => {
      const input = document.getElementById('photo_' + a);
      const preview = document.getElementById('preview_' + a);
      input.addEventListener('change', (e) => {
        const f = e.target.files[0]; if (!f) return;
        const resetPhoto = () => {
          photoData[a] = null; input.value = ''; preview.style.display = 'none';
          msg.textContent = '圖片讀取失敗，換一張試試'; msg.style.color = '#C62828';
        };
        // 壓縮：長邊縮到 1080，JPEG 0.7，避免 base64 過大
        const img = new Image(); const rd = new FileReader();
        rd.onerror = resetPhoto; img.onerror = resetPhoto;
        rd.onload = () => { img.onload = () => {
          const max = 1080; let { width: w, height: h } = img;
          if (Math.max(w, h) > max) { const r = max / Math.max(w, h); w = Math.round(w*r); h = Math.round(h*r); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          photoData[a] = c.toDataURL('image/jpeg', 0.7);
          preview.src = photoData[a]; preview.style.display = 'block';
        }; img.src = rd.result; };
        rd.readAsDataURL(f);
      });
    });
    document.getElementById('save').addEventListener('click', async () => {
      const weight = document.getElementById('weight').value;
      if (!weight) { msg.textContent = '請填體重'; msg.style.color = '#C62828'; return; }
      msg.textContent = '儲存中…'; msg.style.color = '#777';
      const payload = {
        date: document.getElementById('date').value,
        weight_kg: parseFloat(weight),
        waist_cm: document.getElementById('waist').value ? parseFloat(document.getElementById('waist').value) : '',
        note: document.getElementById('note').value,
        photo_front_base64: photoData.front || '',
        photo_side_base64: photoData.side || '',
        photo_back_base64: photoData.back || '',
        client_id: API.genClientId(),
      };
      try {
        const r = await API.apiPost('addBody', payload);
        if (r.ok) { msg.textContent = '已儲存 ✓'; msg.style.color = '#2E7D32';
          document.getElementById('weight').value = ''; document.getElementById('waist').value = '';
          document.getElementById('note').value = '';
          angles.forEach((a) => { photoData[a] = null; document.getElementById('photo_' + a).value = '';
            document.getElementById('preview_' + a).style.display = 'none'; });
        }
        else { msg.textContent = '失敗：' + r.error; msg.style.color = '#C62828'; }
      } catch (err) { msg.textContent = '網路錯誤：' + err.message; msg.style.color = '#C62828'; }
    });
  </script>
</body>
</html>
