<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Body tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    /* 深色運動風：黑底 + 螢光綠 + Manrope */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope","Noto Sans TC",system-ui,sans-serif; background: #0e1116; color: #e6edf3; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
    .header { background: #0b0e12; color: #fff; border-bottom: 1px solid #1c2430; padding: calc(16px + env(safe-area-inset-top)) 20px 16px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .content { padding: 16px; }
    .card { background: #161b22; border: 1px solid #232c38; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .advice { background: #12251b; border: 1px solid #1e5b3c; border-left: 4px solid #00e676; color: #b6f5d0; font-size: 14px; line-height: 1.5; }
    .row { display: flex; gap: 12px; }
    .row .card { flex: 1; text-align: center; }
    .stat .label { font-size: 12px; color: #7d8896; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .stat .val { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stat .sub { font-size: 11px; color: #7d8896; margin-top: 4px; }
    h2 { font-size: 13px; color: #7d8896; margin: 4px 0 8px; font-weight: 600; }
    .legend { font-size: 11px; color: #7d8896; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .card svg { display: block; width: 100%; height: 150px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0b0e12; border-top: 1px solid #1c2430; padding-bottom: env(safe-area-inset-bottom); }
    .nav a { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #7d8896; text-decoration: none; }
    .nav a.active { color: #00e676; font-weight: 700; }
    /* 生理期狀態卡（洋紅，跟螢光綠不衝突） */
    .cyc { background: linear-gradient(180deg, rgba(255,92,138,.10), rgba(255,92,138,.03)); border-color: rgba(255,92,138,.35); }
    .cyc .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .cyc .dayn { font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    .cyc .dayn small { font-size: 13px; color: #ff5c8a; font-weight: 700; margin-left: 4px; }
    .cyc .next { text-align: right; }
    .cyc .next .k { font-size: 11px; color: #7d8896; }
    .cyc .next .v { font-size: 15px; font-weight: 800; color: #ff5c8a; font-variant-numeric: tabular-nums; }
    .cyc .track { height: 8px; border-radius: 6px; background: #1b2129; overflow: hidden; position: relative; }
    .cyc .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff5c8a, #ff8db0); }
    .cyc .track .now { position: absolute; top: -3px; width: 2px; height: 14px; background: #fff; border-radius: 2px; }
    .cyc .scale { display: flex; justify-content: space-between; font-size: 10px; color: #7d8896; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .cyc .empty { font-size: 13px; color: #ffbcd0; line-height: 1.5; }
    .cyc .phase { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px; letter-spacing: .02em; }
    .cyc .phase.menstrual  { color: #ffd0de; background: rgba(255,92,138,.18); }   /* 月經期 洋紅 */
    .cyc .phase.follicular { color: #bfe6ff; background: rgba(80,170,255,.16); }    /* 濾泡期 藍 */
    .cyc .phase.ovulation  { color: #d6f5c0; background: rgba(0,230,118,.16); }     /* 排卵期 綠 */
    .cyc .phase.luteal     { color: #ffe0b0; background: rgba(255,168,60,.16); }    /* 黃體期 橙 */
    .cyc .phase.late       { color: #ffcaca; background: rgba(255,90,90,.16); }     /* 逾期 紅 */
    .cyc .phase-note { font-size: 12px; color: #9aa4b2; margin-top: 8px; line-height: 1.4; }
    .guide { display: flex; flex-direction: column; gap: 8px; }
    .guide .g { font-size: 13px; color: #cbd5e1; line-height: 1.5; }
    .guide .g b { display: inline-block; min-width: 4.5em; color: #fff; font-weight: 700; }
    .guide .g.k b { color: #00e676; }        /* 熱量 */
    .guide .g.t b { color: #bfe6ff; }        /* 訓練 */
    .guide .g.a b { color: #ffd0de; }        /* 有氧 */
    .guide .g.f b { color: #ffe0b0; }        /* 飲食 */
    .src { font-size: 11px; color: #5f6b7a; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">Body tracker</div>
  <div class="content" id="content"><div class="card">載入中…</div></div>
  <nav class="nav">
    <a href="index.html" class="active">儀表板</a>
    <a href="add.html">記錄</a>
    <a href="photos.html">照片</a>
  </nav>
  <script src="js/calc.js"></script>
  <script src="js/advice.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/api.js"></script>
  <script>
    (async () => {
      if (!(await API.requireAuth())) return;   // 沒密碼先鎖屏
      const el = document.getElementById('content');
      let res;
      try { res = await API.apiGet('getAll'); } catch (e) { el.innerHTML = '<div class="card">載入失敗：' + e.message + '</div>'; return; }
      if (!res.ok) { el.innerHTML = '<div class="card">錯誤：' + res.error + '</div>'; return; }
      const { daily, body, cycle, settings } = res.data;
      const setMap = {}; (settings || []).forEach(s => setMap[s.key] = s.value);
      const targetWeightRaw = setMap.target_weight ? parseFloat(setMap.target_weight) : null;
      const targetWeight = Number.isNaN(targetWeightRaw) ? null : targetWeightRaw;

      // daily 理論上是機器依序寫入，但仍做防禦性排序（比照 calc.js 內部自保的做法）
      const dailyAsc = [...daily].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

      // 體重序列 → 7 日均線；手動編輯表格可能留下非數字，過濾掉避免污染整段均線
      const weights = body.filter(b => b.weight_kg !== '' && b.weight_kg != null)
        .map(b => ({ date: String(b.date).slice(0, 10), value: parseFloat(b.weight_kg) }))
        .filter(w => Number.isFinite(w.value));
      const ma = Calc.movingAverage(weights, 7);

      // ── 生理期／週期 ──
      const periodDays = parseInt(setMap.period_days, 10) || 7;   // 經期天數（預設 7）
      const cycleDays = parseInt(setMap.cycle_days, 10) || 30;    // 週期天數（預設 30）
      const cycleStarts = (cycle || []).map(c => String(c.date).slice(0, 10)).filter(Boolean);
      const cs = Calc.cycleStats(cycleStarts, cycleDays);         // {avgCycle,lastStart,predictedNext,currentDay,estimated}
      const periodSet = Calc.periodDateSet(cycleStarts, periodDays);
      // 體重圖標記：把「每個體重點的日期是否落在生理期」壓成色塊（分數索引，對齊折線）
      const periodBandList = Calc.periodBands(ma.map(m => periodSet.has(m.date)));
      const todayLocal = Calc.formatLocalDate(new Date());
      const inPeriodToday = periodSet.has(todayLocal);

      // 近 14 天窗口算趨勢，避免整段歷史稀釋
      const recentMa = ma.slice(-14);
      const kgPerWeek = Calc.weeklyTrendChange(recentMa);
      const dailyBal = kgPerWeek != null ? Calc.dailyEnergyBalance(kgPerWeek) : null;

      // 近 7 天平均 TDEE（先過濾非數字，全部無效則回 null）
      const recentDaily = dailyAsc.filter(d => d.tdee_total !== '' && d.tdee_total != null)
        .map(d => parseFloat(d.tdee_total))
        .filter(Number.isFinite)
        .slice(-7);
      const avgTDEE = recentDaily.length ? recentDaily.reduce((s, v) => s + v, 0) / recentDaily.length : null;
      const estIntake = (avgTDEE != null && kgPerWeek != null) ? Calc.estimateIntake(avgTDEE, kgPerWeek) : null;

      const curTrend = ma.length ? ma[ma.length - 1].avg : null;
      const proj = (curTrend != null && targetWeight != null && kgPerWeek != null)
        ? Calc.projectGoal(curTrend, targetWeight, kgPerWeek) : null;

      // 恢復指標（近 3 天平均）
      const recent3 = dailyAsc.slice(-3);
      const avg = (arr, k) => { const v = arr.map(x => parseFloat(x[k])).filter(n => !isNaN(n)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
      const sleepScore = avg(recent3, 'sleep_score'), avgStress = avg(recent3, 'avg_stress'), bodyBattery = avg(recent3, 'body_battery');
      const weightStalled = kgPerWeek != null && Math.abs(kgPerWeek) < 0.1;
      const advice = Advice.dailyAdvice({ sleepScore, avgStress, bodyBattery, weightKgPerWeek: kgPerWeek, weightStalled });

      // 今日訓練準備：取最新一天的 Garmin 數據（這是「今天該訓練還是休息」的即時快照，非平均）
      const latestDaily = dailyAsc.length ? dailyAsc[dailyAsc.length - 1] : {};
      const numOrNull = (v) => (v !== '' && v != null && Number.isFinite(parseFloat(v))) ? parseFloat(v) : null;
      const trReady = numOrNull(latestDaily.training_readiness);
      const hrvNight = numOrNull(latestDaily.hrv_last_night);
      const hrvStatus = latestDaily.hrv_status || null;
      const hrvZh = { BALANCED: '均衡', UNBALANCED: '失衡', LOW: '偏低', POOR: '差', GOOD: '良好' };
      const readyLabel = (s) => (s == null || Number.isNaN(s)) ? '—'
        : s >= 70 ? '✅ 適合訓練'
        : s >= 40 ? '🟡 可訓練，強度收斂'
        : '🔴 建議休息／輕鬆活動';

      // 沒有 Garmin 原生準備度分數時，用當天 HRV狀態/睡眠/壓力/身體電量 自估「今天適合訓練還是休息」
      const ldSleep = numOrNull(latestDaily.sleep_score);
      const ldStress = numOrNull(latestDaily.avg_stress);
      const ldBattery = numOrNull(latestDaily.body_battery);
      function computedReadiness() {
        let good = 0, bad = 0, n = 0;
        if (hrvStatus) { n++; if (hrvStatus === 'BALANCED' || hrvStatus === 'GOOD') good++; else bad++; }
        if (ldSleep != null) { n++; if (ldSleep >= 80) good++; else if (ldSleep < 60) bad++; }
        if (ldStress != null) { n++; if (ldStress <= 30) good++; else if (ldStress > 50) bad++; }
        if (ldBattery != null) { n++; if (ldBattery >= 70) good++; else if (ldBattery < 40) bad++; }
        if (n === 0) return '—';
        if (bad >= 2) return '🔴 建議休息／輕鬆活動';
        if (good >= 2 && bad === 0) return '✅ 適合訓練';
        return '🟡 可訓練，強度收斂';
      }
      const readyText = (trReady != null) ? readyLabel(trReady) : computedReadiness();
      const readyScore = (trReady != null) ? f(trReady, 0) : '—';
      const readyNote = (trReady != null) ? '' : '（依 HRV／睡眠／壓力／身體電量估）';

      // 體重圖：原始點 + 均線 + 目標線
      // 兩條線都從已依日期排序的 ma 陣列取值（body 分頁可能有補登的舊資料造成順序錯亂，
      // chart.js 是用陣列索引當 x 軸，若原始點不跟均線同一份排序來源會對不齊）
      const chartSvg = Chart.lineChartSVG({
        width: 320, height: 150,
        series: [
          { name: 'raw', color: '#2f3b34', points: ma.map(m => ({ x: 0, y: m.value })) },
          { name: 'ma', color: '#00e676', points: ma.map(m => ({ x: 0, y: m.avg })) },
        ],
        targetY: targetWeight,
        bands: periodBandList,   // 生理期那幾天的淡洋紅背景
      });

      const f = (n, d = 1) => (n == null || Number.isNaN(n)) ? '—' : Number(n).toFixed(d);

      // 各期建議（整理自「荷爾蒙週期訓練飲食」筆記 estherxun + 上課用荷爾蒙曲線圖，照原文不腦補）
      const PHASE_GUIDE = {
        menstrual: {
          k: '維持～小赤字（-0～10% TDEE）',
          t: '全身輕阻力 30–45 分',
          a: '輕～中度快走 20–30 分',
          f: '食慾降低、特別想高碳水；恢復減壓為主，可調整運動強度',
        },
        follicular: {
          k: '輕赤字（-10～15% TDEE），最易執行',
          t: '全身重訓 2–3 次，強度可最高',
          a: '間歇或坡度走 20–25 分',
          f: '體力變好、自信增加、體重最輕、睡眠最好、專注力佳，適合高強度／挑戰性工作',
        },
        ovulation: {
          k: '與濾泡期相近或稍高（-8～12%）',
          t: '維持高品質動作、加強熱身與穩定',
          a: '維持濾泡期強度',
          f: '體能高點，維持穩定',
        },
        luteal: {
          k: '維持～微赤字（-0～10%）；經前 2–4 天預留 +100–200 kcal 吃喜歡的',
          t: '全身阻力 2–3 次、拉長休息、紮實中等次數；睡不好就減少高心率日（肌肉修復較慢）',
          a: '快走／坡度走為主',
          f: '易水腫、嘴饞、對身材不滿；代謝增加 89～279kcal 需更多營養。多鎂/鉀/B群/膳食纖維（堅果、深綠菜、香蕉、豆類、黑巧克力、肝臟），蛋白不降、鈉穩定；避免酒精、咖啡因、糖',
        },
      };
      PHASE_GUIDE.late = PHASE_GUIDE.luteal;   // 逾期沿用黃體期建議

      // 生理期狀態卡
      const md = (s) => { const p = String(s).slice(0, 10).split('-'); return `${+p[1]}/${+p[2]}`; };
      let cycleCard, guideCard = '';
      if (cs.lastStart) {
        const daysUntil = Math.round((Calc.parseLocalDate(cs.predictedNext) - Calc.parseLocalDate(todayLocal)) / 86400000);
        const pct = Math.max(0, Math.min(100, Math.round((cs.currentDay / cs.avgCycle) * 100)));
        const scaleMid = daysUntil > 0 ? `還有 ${daysUntil} 天` : daysUntil === 0 ? '預計今天' : `已延 ${-daysUntil} 天`;
        const phase = Calc.cyclePhase(cs.currentDay, cs.avgCycle, periodDays);   // 月經期/濾泡期/排卵期/黃體期
        cycleCard = `
        <div class="card cyc">
          <div class="top">
            <div><div class="dayn">週期第 ${cs.currentDay} <small>天</small></div>
              <span class="phase ${phase.key}">${phase.name}</span></div>
            <div class="next"><div class="k">預計下次${cs.estimated ? '（預估）' : ''}</div><div class="v">${md(cs.predictedNext)}</div></div>
          </div>
          <div class="track"><div class="fill" style="width:${pct}%"></div><div class="now" style="left:${pct}%"></div></div>
          <div class="scale"><span>第1天</span><span>${scaleMid}</span><span>${cs.avgCycle}天</span></div>
          ${phase.note ? `<div class="phase-note">${phase.note}</div>` : ''}
        </div>`;
        // 本期建議卡（訓練/有氧/熱量/飲食）
        const g = PHASE_GUIDE[phase.key];
        if (g) {
          guideCard = `
        <div class="card">
          <h2>本期建議 · ${phase.name}</h2>
          <div class="guide">
            <div class="g t"><b>訓練</b>${g.t}</div>
            <div class="g a"><b>有氧</b>${g.a}</div>
            <div class="g k"><b>熱量</b>${g.k}</div>
            <div class="g f"><b>飲食/狀態</b>${g.f}</div>
          </div>
          <div class="src">整理自你的「荷爾蒙週期訓練飲食」筆記　·　八二原則，增肌減脂非直線，每 3～6 個月看趨勢</div>
        </div>`;
        }
      } else {
        cycleCard = `
        <div class="card cyc">
          <div class="empty">🩸 還沒有生理期紀錄。來的那天到「記錄」頁點一下「今天生理期來了」，這裡就會顯示週期並標在體重圖上。</div>
        </div>`;
      }
      const periodNote = inPeriodToday
        ? `<div class="card advice" style="background:#2a1620;border-color:#5b1e3c;border-left-color:#ff5c8a;color:#ffbcd0">🩸 這幾天是生理期，體重小幅上升多半是水腫、不是變胖，別急著調飲食。</div>`
        : '';

      el.innerHTML = `
        <div class="card advice">💡 ${advice}</div>
        ${cycleCard}
        ${guideCard}
        ${periodNote}
        <div class="card">
          <h2>體重趨勢（原始・7日均線・目標）</h2>
          ${chartSvg}
          <div class="legend">趨勢 ${kgPerWeek == null ? '—' : (kgPerWeek >= 0 ? '+' : '') + f(kgPerWeek, 2) + ' kg/週'}　目前均線 ${f(curTrend)} kg${periodBandList.length ? '　<span style="color:#ff5c8a">▮</span> 生理期' : ''}</div>
        </div>
        <div class="row">
          <div class="card stat"><div class="label">本週實際缺口</div><div class="val">${(dailyBal == null || Number.isNaN(dailyBal)) ? '—' : Math.round(dailyBal)}</div><div class="sub">kcal/日（負=缺口）</div></div>
          <div class="card stat"><div class="label">近7日 TDEE</div><div class="val">${(avgTDEE == null || Number.isNaN(avgTDEE)) ? '—' : Math.round(avgTDEE)}</div><div class="sub">kcal/日</div></div>
        </div>
        <div class="row">
          <div class="card stat"><div class="label">推估攝食</div><div class="val">${(estIntake == null || Number.isNaN(estIntake)) ? '—' : Math.round(estIntake)}</div><div class="sub">kcal/日</div></div>
          <div class="card stat"><div class="label">距目標</div><div class="val">${(curTrend != null && targetWeight != null) ? f(curTrend - targetWeight) : '—'}</div><div class="sub">${proj ? '約 ' + Math.ceil(proj.weeksToGoal) + ' 週・' + proj.etaDate : 'kg'}</div></div>
        </div>
        <div class="card">
          <h2>今日訓練準備</h2>
          <div style="text-align:center; margin:6px 0">
            <div class="val" style="font-size:20px">${readyText}</div>
            ${trReady != null ? `<div class="sub" style="font-size:13px; margin-top:4px">分數 ${readyScore}</div>` : `<div class="sub" style="font-size:11px; margin-top:4px">${readyNote}</div>`}
          </div>
          <div class="row" style="gap:8px; margin-top:8px">
            <div class="stat" style="flex:1"><div class="label">昨晚 HRV</div><div class="val" style="font-size:18px">${hrvNight == null ? '—' : Math.round(hrvNight) + ' ms'}</div></div>
            <div class="stat" style="flex:1"><div class="label">HRV 狀態</div><div class="val" style="font-size:18px">${hrvStatus ? (hrvZh[hrvStatus] || hrvStatus) : '—'}</div></div>
          </div>
        </div>
        <div class="card">
          <h2>恢復狀態（近3日均）</h2>
          <div class="row" style="gap:8px">
            <div class="stat" style="flex:1"><div class="label">睡眠分</div><div class="val" style="font-size:18px">${f(sleepScore, 0)}</div></div>
            <div class="stat" style="flex:1"><div class="label">壓力</div><div class="val" style="font-size:18px">${f(avgStress, 0)}</div></div>
            <div class="stat" style="flex:1"><div class="label">身體電量</div><div class="val" style="font-size:18px">${f(bodyBattery, 0)}</div></div>
          </div>
        </div>`;
    })();
  </script>
</body>
</html>
