# body-tracker/.github/workflows/garmin_daily.yml
name: garmin-daily
on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 台灣隔日 06:00
  workflow_dispatch: {}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r scripts/requirements.txt
      - name: Fetch Garmin
        env:
          # 雲端不能輸驗證碼，改用本機產生的 token（GARMINTOKENS secret＝garmin_login.py 印出的 JSON）
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          # API_URL 非機密（後端網址，沒密碼也沒用）；API_TOKEN 是密碼，改讀 GitHub Secret，不再明文
          API_URL: 'https://script.google.com/macros/s/AKfycbw2xAshmV1x9tzj2dgR2XKPyX2dHgH1TU6NnLLmYfuP6ffVQwr77MQ77s7LjTHr9WytQA/exec'
          API_TOKEN: ${{ secrets.BODY_API_TOKEN }}
        run: python scripts/garmin_daily.py
      - name: 失敗通知（LINE push）
        if: failure()
        # 雲端沒有 macOS Keychain，改用 GitHub Secrets + LINE Messaging API push（同 email-summary repo 慣例）
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "to": "${{ secrets.LINE_USER_ID }}",
              "messages": [{"type":"text","text":"⚠️ Body tracker：Garmin 每日撈取失敗，請到 GitHub → Actions → garmin-daily → Run workflow 手動補跑。"}]
            }'
