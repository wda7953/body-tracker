<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>照片</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
  <style>
    /* 深色運動風：黑底 + 螢光綠 + Manrope */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Manrope","Noto Sans TC",system-ui,sans-serif; background: #0e1116; color: #e6edf3; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
    .header { background: #0b0e12; color: #fff; border-bottom: 1px solid #1c2430; padding: calc(16px + env(safe-area-inset-top)) 20px 16px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
    .content { padding: 16px; }
    .compare { display: flex; gap: 10px; margin-bottom: 16px; }
    .compare figure { flex: 1; }
    .compare img { width: 100%; border-radius: 12px; }
    .compare figcaption { font-size: 12px; color: #7d8896; text-align: center; margin-top: 4px; }
    .compare .cmp-label { font-size: 12px; color: #00e676; margin-bottom: 6px; font-weight: 700; }
    .day { background: #161b22; border: 1px solid #232c38; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .day-date { font-size: 13px; font-weight: 700; color: #00e676; margin-bottom: 8px; }
    .day-shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .day-shots figure img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; }
    .day-shots figcaption { font-size: 11px; color: #7d8896; text-align: center; margin-top: 2px; }
    .empty { text-align: center; color: #7d8896; padding: 40px 0; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #0b0e12; border-top: 1px solid #1c2430; padding-bottom: env(safe-area-inset-bottom); }
    .nav a { flex: 1; text-align: center; padding: 12px; font-size: 12px; color: #7d8896; text-decoration: none; }
    .nav a.active { color: #00e676; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">照片牆</div>
  <div class="content" id="content"><div class="empty">載入中…</div></div>
  <nav class="nav">
    <a href="index.html">儀表板</a>
    <a href="add.html">記錄</a>
    <a href="photos.html" class="active">照片</a>
  </nav>
  <script src="js/api.js"></script>
  <script>
    const url = (id) => `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
    (async () => {
      const el = document.getElementById('content');
      let res; try { res = await API.apiGet('getAll'); } catch (e) { el.innerHTML = '<div class="empty">載入失敗</div>'; return; }
      // 每筆記錄可有正/側/背三張，至少一張才顯示
      const entries = (res.data.body || [])
        .map(b => ({ date: String(b.date).slice(0, 10), front: b.photo_front, side: b.photo_side, back: b.photo_back }))
        .filter(e => e.front || e.side || e.back)
        .sort((a, b) => a.date < b.date ? -1 : 1);
      if (!entries.length) { el.innerHTML = '<div class="empty">還沒有照片，去「記錄」拍第一張吧</div>'; return; }

      let html = '';
      // 正面對比：最早 vs 最新（都有正面照時才顯示）
      const fronts = entries.filter(e => e.front);
      if (fronts.length >= 2) {
        const first = fronts[0], last = fronts[fronts.length - 1];
        html += `<div class="compare">
          <figure><div class="cmp-label">起點正面 ${first.date}</div><img src="${url(first.front)}" loading="lazy"></figure>
          <figure><div class="cmp-label">最新正面 ${last.date}</div><img src="${url(last.front)}" loading="lazy"></figure>
        </div>`;
      }
      // 各日期（最新在前），顯示該日有的角度
      html += entries.slice().reverse().map(e => {
        const shots = [['正面', e.front], ['側面', e.side], ['背面', e.back]].filter(([l, id]) => id);
        return `<div class="day"><div class="day-date">${e.date}</div><div class="day-shots">` +
          shots.map(([l, id]) => `<figure><img src="${url(id)}" loading="lazy"><figcaption>${l}</figcaption></figure>`).join('') +
          `</div></div>`;
      }).join('');
      el.innerHTML = html;
    })();
  </script>
</body>
</html>
